<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderWise AI - Personalized Travel Itinerary Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z'/></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SCENARIOS = [
      {
        id: "solo_weekend",
        title: "Scenario 1: Solo Weekend Getaway",
        subtitle: "Short weekend trip, optimized travel time & affordable dining",
        icon: "🎒",
        badge: "Solo Explorer",
        preferences: {
          destination: "Paris",
          start_date: "2026-11-06",
          end_date: "2026-11-08",
          travel_style: "solo",
          group_size: 1,
          budget_tier: "budget",
          total_budget_limit: 300,
          pace: "moderate",
          interests: ["sightseeing", "food", "culture"],
          special_requests: "Solo-friendly eateries with easy walking routes."
        }
      },
      {
        id: "couple_romantic",
        title: "Scenario 2: Romantic Couple Vacation",
        subtitle: "Relaxed pacing, scenic sunset spots & premium stays",
        icon: "💑",
        badge: "Couples Romance",
        preferences: {
          destination: "Rome",
          start_date: "2026-11-12",
          end_date: "2026-11-16",
          travel_style: "couple",
          group_size: 2,
          budget_tier: "luxury",
          total_budget_limit: 1500,
          pace: "relaxed",
          interests: ["romantic", "culture", "fine dining", "nature"],
          special_requests: "Intimate dinner spots with panoramic views and unhurried schedule."
        }
      },
      {
        id: "group_friends",
        title: "Scenario 3: Small Group Multi-Day Trip",
        subtitle: "Group coordination, balanced adventure & split budgets",
        icon: "👥",
        badge: "Group Adventure",
        preferences: {
          destination: "Tokyo",
          start_date: "2026-11-20",
          end_date: "2026-11-24",
          travel_style: "friends",
          group_size: 4,
          budget_tier: "moderate",
          total_budget_limit: 2000,
          pace: "fast-paced",
          interests: ["adventure", "culture", "food", "nightlife", "shopping"],
          special_requests: "Buffer times between activities to avoid group delays; clear cost splits."
        }
      }
    ];

    function generateSmartPlan(prefs) {
      const d1 = new Date(prefs.start_date || "2026-11-01");
      const d2 = new Date(prefs.end_date || "2026-11-03");
      const diff = Math.max(1, Math.min(Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) + 1, 14)) || 3;
      const dest = prefs.destination || "Paris";
      const isSolo = prefs.travel_style === "solo";
      const isCouple = prefs.travel_style === "couple";
      const isFriends = prefs.travel_style === "friends";

      const mult = prefs.budget_tier === "budget" ? 0.6 : (prefs.budget_tier === "luxury" ? 2.2 : 1.0);

      const days = [];
      let totalCost = 0;

      const themePool = isSolo ? [
        "Historic Quarters, Cozy Cafés & Pedestrian Bridges",
        "Artisan Hidden Gems, Flea Markets & Street Food",
        "Scenic Panorama, Bookstore Stroll & Jazz Cellar",
        "Local Museums & Bohemian Evening Promenade"
      ] : (isCouple ? [
        "Sunset Vistas & Candlelit Welcome in Old Town",
        "Art, Architecture & Intimate Riverside Stroll",
        "Private Vineyard / Garden Tour & Panoramic Dinner",
        "Scenic Clifftop Overlook & Relaxed Morning Brunch"
      ] : [
        "Group High Points: City Landmarks & Street Food Crawl",
        "Iconic Sightseeing Quest & Interactive Arcade Challenge",
        "Cultural Discovery & Lively Izakaya / Group Dining",
        "Scenic Skyline Gathering & Night Market Exploration"
      ]);

      for (let i = 0; i < diff; i++) {
        const d = new Date(d1);
        d.setDate(d1.getDate() + i);
        const dateStr = d.toISOString().split("T")[0];

        const mCost = Math.round(18 * mult);
        const aCost = Math.round(32 * mult);
        const eCost = Math.round(25 * mult);
        const dayCost = mCost + aCost + eCost;
        totalCost += dayCost;

        days.push({
          day_number: i + 1,
          date: dateStr,
          theme: themePool[i % themePool.length],
          daily_estimated_cost: dayCost,
          logistics_advice: isSolo 
            ? "Clustered within a 1.5-mile walkable radius to minimize walking fatigue."
            : (isCouple 
              ? "Leisurely walking routes with convenient car service options."
              : `Split into 2 rideshares for ${prefs.group_size} travelers. Plan 20-min buffer at meeting points.`),
          morning_activities: [{
            id: `act_m_${i+1}_${Date.now()}`,
            title: i === 0 ? `${dest} Historic Heart & Signature Landmark` : `${dest} Morning Architectural Highlight`,
            description: `Beat peak visitor hours with early morning access. Enjoy peaceful views of ${dest}.`,
            category: "attraction",
            time_slot: "09:00 AM - 11:30 AM",
            estimated_cost: mCost,
            location_name: `${dest} Central Historic Quarter`,
            address: `Main Heritage Way, ${dest}`,
            travel_time_from_prev: "10 mins from stay",
            tips: "Pre-book tickets online to skip line. Wear cushioned walking shoes.",
            is_completed: i === 0
          }],
          afternoon_activities: [{
            id: `act_a_${i+1}_${Date.now()}`,
            title: `Artisan Quarter & Local Market Tasting`,
            description: `Wander through independent boutiques and taste signature specialties of ${dest}.`,
            category: "attraction",
            time_slot: "01:30 PM - 04:30 PM",
            estimated_cost: aCost,
            location_name: `${dest} Arts District`,
            address: `Artisan Square, ${dest}`,
            travel_time_from_prev: "12 mins walk",
            tips: "Independent vendors often provide free samples. Cards accepted.",
            is_completed: false
          }],
          evening_activities: [{
            id: `act_e_${i+1}_${Date.now()}`,
            title: `Golden Hour Sunset Promenade & Skyline Views`,
            description: `Relaxing sunset transition into vibrant evening dining atmosphere.`,
            category: isCouple ? "relaxation" : "entertainment",
            time_slot: "05:30 PM - 07:30 PM",
            estimated_cost: eCost,
            location_name: `${dest} Scenic Lookout`,
            address: `Panoramic Terrace, ${dest}`,
            travel_time_from_prev: "15 mins transit",
            tips: "Arrive 20 minutes before sunset for the golden hour light.",
            is_completed: false
          }],
          dining_options: [
            {
              id: `din_b_${i}`,
              meal_type: "Breakfast",
              restaurant_name: `Café ${dest} Roasters`,
              cuisine: "Artisan Coffee & Bakery",
              price_range: prefs.budget_tier === "budget" ? "$" : "$$",
              recommended_dish: "Handmade Croissants & Specialty Roast",
              notes: "Friendly counter seating."
            },
            {
              id: `din_l_${i}`,
              meal_type: "Lunch",
              restaurant_name: `Bistro / Trattoria del ${dest}`,
              cuisine: "Traditional Regional",
              price_range: "$$",
              recommended_dish: "Market Special of the Day",
              notes: isSolo ? "Welcoming to solo diners." : "Group tables available."
            },
            {
              id: `din_d_${i}`,
              meal_type: "Dinner",
              restaurant_name: `La Terrazza ${dest}`,
              cuisine: "Contemporary Dining",
              price_range: isCouple || prefs.budget_tier === "luxury" ? "$$$" : "$$",
              recommended_dish: "Chef's Signature Tasting Plate & Wine Pairing",
              notes: "Sunset panoramic views. Prior booking suggested."
            }
          ]
        });
      }

      return {
        id: `itin_${Date.now()}`,
        trip_id: `trip_${Date.now()}`,
        destination: dest,
        title: isSolo 
          ? `Solo Explorer: ${dest} Smart Weekend Getaway`
          : (isCouple ? `Romantic Escape: ${dest} for Two` : `${dest} Group Journey (${prefs.group_size} Friends)`),
        summary: `A customized ${diff}-day itinerary in ${dest} engineered for your ${prefs.travel_style} travel style, ${prefs.budget_tier} budget tier, and ${prefs.pace} pace.`,
        total_days: diff,
        total_estimated_cost: totalCost,
        packing_tips: [
          "Comfortable walking footwear (15,000+ daily steps)",
          "Universal adapter with USB-C PD fast charge",
          "Compact rainproof jacket",
          "Contactless credit/debit card"
        ],
        local_customs_advice: `In ${dest}, carry small cash for smaller markets and always greet shopkeepers politely upon entering.`,
        preferences: prefs,
        days: days
      };
    }

    function App() {
      const [preferences, setPreferences] = useState(SCENARIOS[0].preferences);
      const [activePresetId, setActivePresetId] = useState("solo_weekend");
      const [itinerary, setItinerary] = useState(() => generateSmartPlan(SCENARIOS[0].preferences));
      const [activeDayIdx, setActiveDayIdx] = useState(0);
      const [isGenerating, setIsGenerating] = useState(false);
      const [savedTrips, setSavedTrips] = useState([]);
      const [showSavedModal, setShowSavedModal] = useState(false);
      const [showExportModal, setShowExportModal] = useState(false);
      const [copied, setCopied] = useState(false);
      const [showRegenModal, setShowRegenModal] = useState(false);
      const [regenFeedback, setRegenFeedback] = useState("");

      useEffect(() => {
        const saved = localStorage.getItem("wanderwise_trips");
        if (saved) {
          try { setSavedTrips(JSON.parse(saved)); } catch(e){}
        }
      }, []);

      const handleSelectScenario = (sc) => {
        setActivePresetId(sc.id);
        setPreferences(sc.preferences);
        setIsGenerating(true);
        setTimeout(() => {
          const newItin = generateSmartPlan(sc.preferences);
          setItinerary(newItin);
          setActiveDayIdx(0);
          setIsGenerating(false);
        }, 300);
      };

      const handleGenerate = () => {
        if (!preferences.destination) {
          alert("Please enter a destination!");
          return;
        }
        setIsGenerating(true);
        setTimeout(() => {
          const newItin = generateSmartPlan(preferences);
          setItinerary(newItin);
          setActiveDayIdx(0);
          setIsGenerating(false);
        }, 400);
      };

      const handleToggleActivity = (actId) => {
        const updatedDays = itinerary.days.map((day) => {
          const toggle = (list) => list.map((a) => a.id === actId ? { ...a, is_completed: !a.is_completed } : a);
          return {
            ...day,
            morning_activities: toggle(day.morning_activities),
            afternoon_activities: toggle(day.afternoon_activities),
            evening_activities: toggle(day.evening_activities)
          };
        });
        setItinerary({ ...itinerary, days: updatedDays });
      };

      const handleRegenSubmit = (e) => {
        e.preventDefault();
        const curDay = itinerary.days[activeDayIdx];
        const dest = itinerary.destination;
        const newMorn = [{
          id: `act_reg_m_${Date.now()}`,
          title: `${dest} Botanical Gardens & Outdoor Pavilion`,
          description: `Customized route based on feedback: "${regenFeedback || "More outdoor nature and slow pacing"}"`,
          category: "relaxation",
          time_slot: "09:30 AM - 11:45 AM",
          estimated_cost: 15.0,
          location_name: `${dest} Waterfront Promenade`,
          address: `Riverside Walk, ${dest}`,
          travel_time_from_prev: "10 mins transit",
          tips: "Tranquil morning spot without heavy crowds.",
          is_completed: false
        }];
        const newAft = [{
          id: `act_reg_a_${Date.now()}`,
          title: `${dest} Contemporary Art & Artisan Workshop`,
          description: "Hands-on demonstration of regional crafts and local boutique shopping.",
          category: "attraction",
          time_slot: "02:00 PM - 04:30 PM",
          estimated_cost: 25.0,
          location_name: `${dest} Creative District`,
          address: `Artisan Way, ${dest}`,
          travel_time_from_prev: "12 mins walk",
          tips: "Great for unique souvenirs.",
          is_completed: false
        }];
        const newEve = [{
          id: `act_reg_e_${Date.now()}`,
          title: `Riverside Acoustic Lounge & Tapas`,
          description: "Relaxed twilight terrace with acoustic melodies and small bites.",
          category: "entertainment",
          time_slot: "06:00 PM - 08:30 PM",
          estimated_cost: 30.0,
          location_name: `${dest} High Point Lounge`,
          address: `Rooftop Terrace, ${dest}`,
          travel_time_from_prev: "15 mins",
          tips: "Panoramic golden hour overlook.",
          is_completed: false
        }];

        const newDayCost = 15.0 + 25.0 + 30.0;
        const updatedDays = [...itinerary.days];
        updatedDays[activeDayIdx] = {
          ...curDay,
          theme: `Day ${curDay.day_number}: Custom Refined Route (${regenFeedback ? regenFeedback.slice(0, 20) : "Scenic Focus"})`,
          morning_activities: newMorn,
          afternoon_activities: newAft,
          evening_activities: newEve,
          daily_estimated_cost: newDayCost,
          logistics_advice: "Clustered walking circuit with convenient transit connection."
        };
        const newTotal = updatedDays.reduce((a, b) => a + b.daily_estimated_cost, 0);
        setItinerary({ ...itinerary, days: updatedDays, total_estimated_cost: newTotal });
        setShowRegenModal(false);
        setRegenFeedback("");
      };

      const handleSave = () => {
        const existing = savedTrips.filter((t) => t.id !== itinerary.id);
        const updated = [itinerary, ...existing];
        setSavedTrips(updated);
        localStorage.setItem("wanderwise_trips", JSON.stringify(updated));
        alert("Trip saved successfully to your collection!");
      };

      const currentDay = itinerary.days[activeDayIdx] || itinerary.days[0];
      const targetBudget = preferences.total_budget_limit || (itinerary.total_estimated_cost * 1.25);
      const groupSize = preferences.group_size || 1;
      const perPerson = Math.round(itinerary.total_estimated_cost / groupSize);

      return (
        <div>
          {/* Header */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-md">
                  ✈️
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-lg text-slate-900 tracking-tight">WanderWise AI</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                      Google Cloud GenAI
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 hidden sm:block">Personalized Travel Itinerary Planner</p>
                </div>
              </div>

              {/* Scenario Quick Buttons */}
              <div className="hidden md:flex items-center space-x-2 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                {SCENARIOS.map((sc) => (
                  <button
                    key={sc.id}
                    onClick={() => handleSelectScenario(sc)}
                    className={`px-3 py-1.5 rounded-lg transition ${
                      activePresetId === sc.id ? "bg-white text-indigo-700 shadow-xs" : "text-slate-600 hover:text-slate-900"
                    }`}
                  >
                    {sc.icon} {sc.badge}
                  </button>
                ))}
              </div>

              <div className="flex items-center space-x-2.5">
                <button
                  onClick={() => setShowSavedModal(true)}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center space-x-1"
                >
                  <span>Saved</span>
                  {savedTrips.length > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full bg-indigo-600 text-white text-[10px] font-bold">
                      {savedTrips.length}
                    </span>
                  )}
                </button>
                <button
                  onClick={handleSave}
                  className="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm"
                >
                  💾 Save Trip
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 pb-20">
            {/* Scenarios Section */}
            <div className="mb-6">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500">
                  Select Project Evaluation Scenario
                </h2>
                <span className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  3 Scenarios Ready
                </span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                {SCENARIOS.map((sc) => (
                  <div
                    key={sc.id}
                    onClick={() => handleSelectScenario(sc)}
                    className={`cursor-pointer rounded-2xl p-4 border text-left transition ${
                      activePresetId === sc.id
                        ? "bg-indigo-50/80 border-indigo-500 ring-2 ring-indigo-500/20 shadow-sm"
                        : "bg-white border-slate-200 hover:border-indigo-300 shadow-xs"
                    }`}
                  >
                    <div className="flex items-center space-x-2.5 mb-1.5">
                      <span className="text-2xl">{sc.icon}</span>
                      <div>
                        <span className="text-[10px] font-bold uppercase text-indigo-700 bg-indigo-100/60 px-2 py-0.5 rounded-full">
                          {sc.badge}
                        </span>
                        <h4 className="text-xs font-bold text-slate-900 mt-0.5">{sc.title}</h4>
                      </div>
                    </div>
                    <p className="text-[11px] text-slate-500 leading-snug">{sc.subtitle}</p>
                    <div className="flex items-center justify-between mt-2.5 pt-2 border-t border-slate-100 text-[11px] text-slate-600">
                      <span>📍 {sc.preferences.destination}</span>
                      <span className="text-indigo-600 font-bold">Preload &rarr;</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Trip Builder Card */}
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200 shadow-sm mb-8">
              <div className="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
                <div>
                  <h3 className="text-lg font-black text-slate-900">Trip Preferences & Parameters</h3>
                  <p className="text-xs text-slate-400">Configure parameters or change city to generate custom AI itinerary</p>
                </div>
                <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-200">
                  {itinerary.total_days} Days Plan
                </span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Destination City</label>
                  <input
                    type="text"
                    value={preferences.destination}
                    onChange={(e) => setPreferences({ ...preferences, destination: e.target.value })}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="e.g. Paris, Tokyo, Rome, New York"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Start Date</label>
                  <input
                    type="date"
                    value={preferences.start_date}
                    onChange={(e) => setPreferences({ ...preferences, start_date: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-700 mb-1">End Date</label>
                  <input
                    type="date"
                    value={preferences.end_date}
                    onChange={(e) => setPreferences({ ...preferences, end_date: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium"
                  />
                </div>
              </div>

              {/* Row 2: Travel Style, Group Size, Budget, Pace */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
                <div>
                  <label className="block text-[11px] font-bold uppercase text-slate-600 mb-1">Travel Style</label>
                  <select
                    value={preferences.travel_style}
                    onChange={(e) => setPreferences({
                      ...preferences,
                      travel_style: e.target.value,
                      group_size: e.target.value === "solo" ? 1 : (e.target.value === "couple" ? 2 : (preferences.group_size < 3 ? 4 : preferences.group_size))
                    })}
                    className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold"
                  >
                    <option value="solo">🎒 Solo Traveler</option>
                    <option value="couple">💑 Romantic Couple</option>
                    <option value="friends">👥 Group / Friends</option>
                    <option value="family">👨‍👩‍👧 Family Holiday</option>
                  </select>
                </div>

                <div>
                  <label className="block text-[11px] font-bold uppercase text-slate-600 mb-1">Group Size</label>
                  <input
                    type="number"
                    min="1"
                    max="50"
                    value={preferences.group_size || 1}
                    onChange={(e) => setPreferences({ ...preferences, group_size: parseInt(e.target.value) || 1 })}
                    className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-center"
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-bold uppercase text-slate-600 mb-1">Budget Tier</label>
                  <select
                    value={preferences.budget_tier}
                    onChange={(e) => setPreferences({ ...preferences, budget_tier: e.target.value })}
                    className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold"
                  >
                    <option value="budget">$ Budget</option>
                    <option value="moderate">$$ Moderate</option>
                    <option value="luxury">$$$ Luxury</option>
                  </select>
                </div>

                <div>
                  <label className="block text-[11px] font-bold uppercase text-slate-600 mb-1">Pacing</label>
                  <select
                    value={preferences.pace}
                    onChange={(e) => setPreferences({ ...preferences, pace: e.target.value })}
                    className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold"
                  >
                    <option value="relaxed">Relaxed</option>
                    <option value="moderate">Balanced</option>
                    <option value="fast-paced">Fast-Paced</option>
                  </select>
                </div>
              </div>

              <div className="mt-5">
                <button
                  onClick={handleGenerate}
                  disabled={isGenerating}
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-extrabold text-xs uppercase tracking-wider shadow-md transition"
                >
                  {isGenerating ? "Synthesizing AI Itinerary..." : "✨ Generate AI Travel Itinerary"}
                </button>
              </div>
            </div>

            {/* Generated Itinerary Section */}
            <div className="space-y-6">
              {/* Trip Overview Card */}
              <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200 shadow-sm">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-4">
                  <div>
                    <div className="flex items-center space-x-2 text-xs font-bold text-indigo-700 mb-1">
                      <span className="uppercase">{preferences.travel_style} Trip</span>
                      <span>•</span>
                      <span>{itinerary.total_days} Days</span>
                      <span>•</span>
                      <span>{groupSize === 1 ? "1 Solo Traveler" : `${groupSize} Travelers`}</span>
                    </div>
                    <h2 className="text-2xl font-black text-slate-900">{itinerary.title}</h2>
                    <p className="text-xs text-slate-500 mt-1 max-w-2xl">{itinerary.summary}</p>
                  </div>

                  <div className="flex items-center space-x-2 shrink-0">
                    <button
                      onClick={() => setShowExportModal(true)}
                      className="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 transition"
                    >
                      📤 Share & Export
                    </button>
                  </div>
                </div>

                {/* Day Tabs */}
                <div className="flex items-center space-x-2 mt-4 overflow-x-auto pb-1">
                  {itinerary.days.map((d, idx) => (
                    <button
                      key={d.day_number}
                      onClick={() => setActiveDayIdx(idx)}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2 whitespace-nowrap ${
                        activeDayIdx === idx
                          ? "bg-indigo-600 text-white shadow-xs"
                          : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                      }`}
                    >
                      <span>Day {d.day_number}</span>
                      <span className="text-[10px] opacity-75">(${d.daily_estimated_cost})</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* 2-Column Grid */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* Main Activities Column */}
                <div className="lg:col-span-2 space-y-6">
                  {/* Day Banner */}
                  <div className="bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-3xl p-6 shadow-sm">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <span className="text-xs font-bold text-indigo-300 uppercase">
                          Day {currentDay.day_number} • {currentDay.date}
                        </span>
                        <h3 className="text-xl font-black mt-0.5">{currentDay.theme}</h3>
                        <p className="text-xs text-indigo-200/80 mt-1">🧭 Route: {currentDay.logistics_advice}</p>
                      </div>

                      <div className="flex items-center space-x-2 shrink-0">
                        <div className="bg-white/10 px-3 py-1.5 rounded-xl text-right">
                          <span className="text-[10px] uppercase text-indigo-200 block font-bold">Est. Spend</span>
                          <span className="text-base font-black">${currentDay.daily_estimated_cost}</span>
                        </div>
                        <button
                          onClick={() => setShowRegenModal(true)}
                          className="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
                        >
                          🔄 Rewrite Day
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Morning, Afternoon, Evening Activity Cards */}
                  <div className="space-y-4">
                    <div>
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Morning</h4>
                      {currentDay.morning_activities.map((a) => (
                        <div key={a.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs mb-3 flex items-start justify-between">
                          <div className="flex items-start space-x-3">
                            <button
                              onClick={() => handleToggleActivity(a.id)}
                              className={`mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center ${
                                a.is_completed ? "bg-emerald-600 border-emerald-600 text-white" : "border-slate-300 bg-white"
                              }`}
                            >
                              {a.is_completed && "✓"}
                            </button>
                            <div>
                              <div className="flex items-center space-x-2 mb-1">
                                <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">
                                  🏛️ {a.category}
                                </span>
                                <span className="text-[11px] font-semibold text-slate-500">⏰ {a.time_slot}</span>
                                {a.travel_time_from_prev && (
                                  <span className="text-[10px] text-slate-400">🚶 {a.travel_time_from_prev}</span>
                                )}
                              </div>
                              <h5 className={`text-sm font-bold ${a.is_completed ? "line-through text-slate-400" : "text-slate-900"}`}>
                                {a.title}
                              </h5>
                              <p className="text-xs text-slate-600 mt-1">{a.description}</p>
                              {a.tips && (
                                <div className="mt-2 text-[11px] text-amber-800 bg-amber-50 p-2 rounded-lg">
                                  💡 <strong>Tip:</strong> {a.tips}
                                </div>
                              )}
                            </div>
                          </div>
                          <span className="text-xs font-bold text-slate-700 bg-slate-100 px-2 py-1 rounded-lg shrink-0">
                            ${a.estimated_cost}
                          </span>
                        </div>
                      ))}
                    </div>

                    <div>
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Afternoon</h4>
                      {currentDay.afternoon_activities.map((a) => (
                        <div key={a.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs mb-3 flex items-start justify-between">
                          <div className="flex items-start space-x-3">
                            <button
                              onClick={() => handleToggleActivity(a.id)}
                              className={`mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center ${
                                a.is_completed ? "bg-emerald-600 border-emerald-600 text-white" : "border-slate-300 bg-white"
                              }`}
                            >
                              {a.is_completed && "✓"}
                            </button>
                            <div>
                              <div className="flex items-center space-x-2 mb-1">
                                <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">
                                  🏛️ {a.category}
                                </span>
                                <span className="text-[11px] font-semibold text-slate-500">⏰ {a.time_slot}</span>
                                {a.travel_time_from_prev && (
                                  <span className="text-[10px] text-slate-400">🚶 {a.travel_time_from_prev}</span>
                                )}
                              </div>
                              <h5 className={`text-sm font-bold ${a.is_completed ? "line-through text-slate-400" : "text-slate-900"}`}>
                                {a.title}
                              </h5>
                              <p className="text-xs text-slate-600 mt-1">{a.description}</p>
                              {a.tips && (
                                <div className="mt-2 text-[11px] text-amber-800 bg-amber-50 p-2 rounded-lg">
                                  💡 <strong>Tip:</strong> {a.tips}
                                </div>
                              )}
                            </div>
                          </div>
                          <span className="text-xs font-bold text-slate-700 bg-slate-100 px-2 py-1 rounded-lg shrink-0">
                            ${a.estimated_cost}
                          </span>
                        </div>
                      ))}
                    </div>

                    <div>
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Evening</h4>
                      {currentDay.evening_activities.map((a) => (
                        <div key={a.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs mb-3 flex items-start justify-between">
                          <div className="flex items-start space-x-3">
                            <button
                              onClick={() => handleToggleActivity(a.id)}
                              className={`mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center ${
                                a.is_completed ? "bg-emerald-600 border-emerald-600 text-white" : "border-slate-300 bg-white"
                              }`}
                            >
                              {a.is_completed && "✓"}
                            </button>
                            <div>
                              <div className="flex items-center space-x-2 mb-1">
                                <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-purple-50 text-purple-700">
                                  🌅 {a.category}
                                </span>
                                <span className="text-[11px] font-semibold text-slate-500">⏰ {a.time_slot}</span>
                                {a.travel_time_from_prev && (
                                  <span className="text-[10px] text-slate-400">🚶 {a.travel_time_from_prev}</span>
                                )}
                              </div>
                              <h5 className={`text-sm font-bold ${a.is_completed ? "line-through text-slate-400" : "text-slate-900"}`}>
                                {a.title}
                              </h5>
                              <p className="text-xs text-slate-600 mt-1">{a.description}</p>
                              {a.tips && (
                                <div className="mt-2 text-[11px] text-amber-800 bg-amber-50 p-2 rounded-lg">
                                  💡 <strong>Tip:</strong> {a.tips}
                                </div>
                              )}
                            </div>
                          </div>
                          <span className="text-xs font-bold text-slate-700 bg-slate-100 px-2 py-1 rounded-lg shrink-0">
                            ${a.estimated_cost}
                          </span>
                        </div>
                      ))}
                    </div>

                    {/* Dining Section */}
                    {currentDay.dining_options && (
                      <div className="bg-emerald-50/60 rounded-3xl p-5 border border-emerald-100">
                        <h4 className="text-xs font-bold uppercase text-emerald-900 mb-3">
                          🍴 Curated Dining Recommendations
                        </h4>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          {currentDay.dining_options.map((d) => (
                            <div key={d.id} className="bg-white rounded-2xl p-3 border border-emerald-200/60 shadow-xs">
                              <div className="flex justify-between items-center mb-1">
                                <span className="text-[10px] font-bold uppercase bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md">
                                  {d.meal_type}
                                </span>
                                <span className="text-xs font-bold text-slate-600">{d.price_range}</span>
                              </div>
                              <h5 className="text-xs font-bold text-slate-900">{d.restaurant_name}</h5>
                              <p className="text-[10px] text-slate-500">{d.cuisine}</p>
                              <div className="mt-2 text-[10px] bg-slate-50 p-1.5 rounded-md text-slate-700">
                                <strong>Try:</strong> {d.recommended_dish}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Sidebar Column: Budget Tracker & Map Timeline */}
                <div className="space-y-6">
                  {/* Budget Tracker */}
                  <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                    <div className="flex items-center justify-between mb-3">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700">Budget Tracker</h4>
                      <span className="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                        ✓ On Track
                      </span>
                    </div>

                    <div className="mb-4">
                      <div className="flex justify-between text-xs font-bold mb-1">
                        <span>Total Trip Spend</span>
                        <span className="text-indigo-600">${itinerary.total_estimated_cost} / ${targetBudget}</span>
                      </div>
                      <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div
                          className="h-full bg-indigo-600 rounded-full"
                          style={{ width: `${Math.min(100, Math.round((itinerary.total_estimated_cost / targetBudget) * 100))}%` }}
                        ></div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-center text-xs">
                      <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <span className="text-[10px] font-bold uppercase text-slate-400 block">Per Person</span>
                        <span className="text-sm font-black text-indigo-700">${perPerson}</span>
                      </div>
                      <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <span className="text-[10px] font-bold uppercase text-slate-400 block">Daily Average</span>
                        <span className="text-sm font-black text-slate-800">
                          ${Math.round(itinerary.total_estimated_cost / itinerary.total_days)}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Visual Route Timeline */}
                  <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700 mb-3">
                      Day {currentDay.day_number} Route Pins
                    </h4>
                    <div className="relative pl-5 space-y-4 before:absolute before:left-2 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-200">
                      {[
                        ...currentDay.morning_activities,
                        ...currentDay.afternoon_activities,
                        ...currentDay.evening_activities
                      ].map((act, i) => (
                        <div key={act.id} className="relative">
                          <div className="absolute -left-5 top-1 w-4 h-4 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[9px] font-bold ring-2 ring-white">
                            {i + 1}
                          </div>
                          <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                            <span className="text-[10px] font-bold text-slate-400 block">{act.time_slot}</span>
                            <span className="font-bold text-slate-900 block truncate">{act.title}</span>
                            <span className="text-[10px] text-slate-500">📍 {act.location_name}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Packing Essentials */}
                  <div className="bg-amber-50/60 rounded-3xl p-5 border border-amber-200/60">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-amber-900 mb-2">
                      🎒 Essential Packing List
                    </h4>
                    <ul className="text-xs text-amber-800 space-y-1 list-disc list-inside">
                      {itinerary.packing_tips.map((t, idx) => (
                        <li key={idx}>{t}</li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {/* Regenerate Day Modal */}
          {showRegenModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-200">
                <h4 className="text-base font-bold text-slate-900">Rewrite Day {currentDay.day_number}</h4>
                <p className="text-xs text-slate-500 mt-1">Specify changes (e.g. "Add a riverside walk and seafood dinner")</p>
                <form onSubmit={handleRegenSubmit} className="mt-4 space-y-4">
                  <textarea
                    value={regenFeedback}
                    onChange={(e) => setRegenFeedback(e.target.value)}
                    placeholder="E.g. More outdoor nature, avoid stairs, local food market..."
                    rows="3"
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  ></textarea>
                  <div className="flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowRegenModal(false)}
                      className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white"
                    >
                      Apply & Regenerate
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Export Modal */}
          {showExportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                  <h3 className="text-base font-bold text-slate-900">Share & Export Travel Itinerary</h3>
                  <button onClick={() => setShowExportModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="space-y-3">
                  <button
                    onClick={() => window.print()}
                    className="w-full p-3.5 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-900 text-xs font-bold flex items-center space-x-2 hover:bg-indigo-100"
                  >
                    <span>🖨️</span>
                    <span>Print Travel Handbook / Save as PDF</span>
                  </button>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(JSON.stringify(itinerary, null, 2));
                      setCopied(true);
                      setTimeout(() => setCopied(false), 2000);
                    }}
                    className="w-full p-3.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 text-xs font-bold flex items-center space-x-2 hover:bg-slate-100"
                  >
                    <span>{copied ? "✅" : "📋"}</span>
                    <span>{copied ? "Copied JSON to Clipboard!" : "Copy Raw JSON Data"}</span>
                  </button>
                </div>
                <div className="mt-5 flex justify-end">
                  <button
                    onClick={() => setShowExportModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Saved Trips Modal */}
          {showSavedModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                  <h3 className="text-base font-bold text-slate-900">Saved Itineraries</h3>
                  <button onClick={() => setShowSavedModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                {savedTrips.length === 0 ? (
                  <p className="text-xs text-slate-400 py-6 text-center">No saved trips yet. Click "Save Trip" to store one!</p>
                ) : (
                  <div className="space-y-2.5 max-h-60 overflow-y-auto">
                    {savedTrips.map((st) => (
                      <div key={st.id} className="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                        <div>
                          <h5 className="font-bold text-slate-900">{st.title}</h5>
                          <span className="text-[10px] text-slate-500">📍 {st.destination} • ${st.total_estimated_cost}</span>
                        </div>
                        <button
                          onClick={() => {
                            setItinerary(st);
                            setPreferences(st.preferences || preferences);
                            setShowSavedModal(false);
                          }}
                          className="px-2.5 py-1 bg-indigo-600 text-white font-bold rounded-lg text-xs"
                        >
                          Load
                        </button>
                      </div>
                    ))}
                  </div>
                )}
                <div className="mt-5 flex justify-end">
                  <button
                    onClick={() => setShowSavedModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
